name: Build and Release RPM for RHEL 9

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: rockylinux:9

    steps:
      - name: Install Git first (required for submodules checkout)
        run: dnf install -y git

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable CRB repository
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb

      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake gcc gcc-c++ make rpm-build \
            openssl-devel libcurl-devel \
            gmp-devel libunistring-devel boost-devel

      - name: Verify HTTP/2 fix is present
        run: |
          grep -n "HTTP_VERSION" src/lib/curl.c || \
            (echo "ERROR: HTTP/2 fix not found in curl.c" && exit 1)

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-Wno-implicit-function-declaration" \
            -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: |
          cd build
          make -j1

      - name: Package RPM
        run: |
          cd build
          make package
          find . -name "*.rpm" -ls

      - name: Upload RPM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubiqclient-rhel9-rpm
          path: build/*.rpm
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.rpm
          body: |
            ## Ubiq C/C++ SDK — RHEL 9 RPM v2.3.1.0

            ### What's changed in v2.3.1.0

            #### Bug fixes (local patches)
            - **Fixed HTTP/2 POST frame mismatch** (`CURLOPT_UPLOAD` + `CURLOPT_CUSTOMREQUEST`)
              - Affects: macOS curl 8.x and RHEL 9.x with nghttp2
              - Fix: Added `CURLOPT_HTTP_VERSION_1_1` in `src/lib/curl.c`
            - **Fixed NULL dereference in billing** (`cJSON_PrintUnformatted` return value not checked)
              - Caused `_strlen_evex` crash under memory pressure when using shared library
              - Fix: Added NULL guard in `send_billing_data()` in `src/lib/billing.c`

            #### Merged from upstream
            - Recursive directory traversal in test harness (`find_files_recursive`) — handles nested subdirectories and filesystems that don't expose `d_type`
            - CI pipeline now runs `dataset_types/` test coverage for all platforms (Debian 11/12, CentOS 9 Stream)

            ### Install on RHEL 9

            **If upgrading from a previous version, uninstall first:**

            ```bash
            sudo rpm -e libubiqclient-dev 2>/dev/null || true
            sudo rpm -e libubiqclient     2>/dev/null || true
            sudo ldconfig
            ```

            **Fresh install:**

            ```bash
            sudo rpm -ivh libubiqclient-2.3.1.0-1.el9.x86_64.rpm
            sudo rpm -ivh libubiqclient-dev-2.3.1.0-1.el9.x86_64.rpm
            ```

            After install, register the shared library with the system linker:

            ```bash
            echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/ubiq-local.conf
            sudo ldconfig
            ```

            ### Compile your app

            ```bash
            gcc your_app.c \
                -I/usr/local/include \
                -L/usr/local/lib \
                -lubiqclient -lssl -lcrypto -lcurl -lgmp -lunistring \
                -Wno-deprecated-declarations \
                -o your_app
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
